<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Job Tracker{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .status-applied { background: #dcfce7; color: #166534; }
        .status-ghosted { background: #f3f4f6; color: #6b7280; }
        .status-rejected { background: #fee2e2; color: #991b1b; }
        .status-interview { background: #fef9c3; color: #854d0e; }
        .status-offer { background: #dbeafe; color: #1e40af; }
        .status-self_schedule { background: #ede9fe; color: #5b21b6; }
    </style>
</head>
<body class="h-full">
    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center space-x-8">
                    <a href="/" class="text-xl font-bold text-indigo-600">JobTracker</a>
                    <a href="/" class="text-sm font-medium text-gray-700 hover:text-indigo-600">Dashboard</a>
                    <a href="/settings" class="text-sm font-medium text-gray-700 hover:text-indigo-600">Settings</a>
                </div>
                <div class="flex items-center" id="nav-stats">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <script>
        async function apiCall(url, options = {}) {
            const resp = await fetch(url, {
                headers: { 'Content-Type': 'application/json', ...options.headers },
                ...options,
            });
            return resp.json();
        }

        // Load nav stats
        apiCall('/api/stats').then(stats => {
            const el = document.getElementById('nav-stats');
            el.innerHTML = `
                <span class="text-xs text-gray-500 mr-4">Today: ${stats.today}/${stats.max_per_day}</span>
                <span class="text-xs text-gray-500">Total: ${stats.total}</span>
            `;
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
